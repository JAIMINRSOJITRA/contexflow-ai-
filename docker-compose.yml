services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: contextflow-api
    ports:
      - "8000:8000"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      DEFAULT_LLM_PROVIDER: ${DEFAULT_LLM_PROVIDER:-gemini}
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./app/db/contextflow.db}
      UPLOAD_FOLDER: ${UPLOAD_FOLDER:-data/uploads}
      VECTOR_INDEX_PATH: ${VECTOR_INDEX_PATH:-data/vector_index/index.faiss}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-gemini}
      LOCAL_EMBEDDING_MODEL: ${LOCAL_EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      CHUNK_SIZE: ${CHUNK_SIZE:-500}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-50}
      TOP_K_RESULTS: ${TOP_K_RESULTS:-4}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - app_data:/app/data
      - database_data:/app/app/db
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1.0"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  app_data:
  database_data:
